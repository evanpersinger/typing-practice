[project]
name = "typing-practice"
version = "0.1.0"
description = "Personalized typing trainer that focuses on your weaknesses."
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "anthropic",
    "openai",
    "python-dotenv",
    "wordfreq",
    "requests",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
